server {
  listen       80;
  server_name  _;
  root /usr/share/nginx/html;
  index index.html;

  # try files so SPA routing falls back to index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Example: proxy to backend if you have API routes under /api
  # location /api/ {
  #   proxy_pass http://backend:8000;
  # }

  # recommended nginx timeouts
  sendfile off;
  client_max_body_size 10M;
  keepalive_timeout 65;
}
